<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BrandGuard – Pre-publication brand governance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f5fb;--pn:#fff;--p2:#eef0f9;--tx:#141a33;--mu:#656d8c;--bd:#e0e3f0;--pr:#5b4bff;--pg:#00a58f;--hi:#e5365b;--md:#e8871a;--lo:#b08f00;--ok:#12a46a;--sh:0 4px 18px rgba(30,40,90,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--pn:#151c34;--p2:#1d2646;--tx:#eef1ff;--mu:#9aa4c7;--bd:#2a3459;--pr:#8b7cff;--pg:#00d1b2;--hi:#ff5c8a;--md:#ffa940;--lo:#ffd23f;--ok:#2ee59d;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b1020;--pn:#151c34;--p2:#1d2646;--tx:#eef1ff;--mu:#9aa4c7;--bd:#2a3459;--pr:#8b7cff;--pg:#00d1b2;--hi:#ff5c8a;--md:#ffa940;--lo:#ffd23f;--ok:#2ee59d;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Inter,system-ui,sans-serif}
#app{display:flex;min-height:100vh}#side{width:240px;flex:none;background:var(--pn);border-right:1px solid var(--bd);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
#main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1180px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;margin-bottom:10px}.logo i{font-style:normal;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pr),var(--pg));display:grid;place-items:center;color:#fff}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:10px 6px 2px;font-weight:700}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--mu);font-weight:600;border:0;background:none;text-align:left;font-family:inherit;font-size:14px;width:100%}
.nav:hover{background:var(--p2);color:var(--tx)}.nav.on{background:var(--pr);color:#fff}.nav b{margin-left:auto;background:var(--hi);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}textarea{resize:vertical;min-height:130px}
input[type=color]{padding:2px;height:38px;width:60px}input[type=checkbox]{width:auto}
select:focus,input:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:1px}
h1{font-size:26px;margin:0 0 4px;font-weight:800}h2{font-size:17px;margin:0 0 10px}.sub{color:var(--mu);margin:0 0 22px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}.mt{margin-top:16px}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}.kpi span{color:var(--mu);font-size:12px}.kpi{border-top:3px solid var(--pr)}
.btn{border:0;border-radius:10px;padding:9px 16px;font:600 13px Inter,sans-serif;cursor:pointer;background:var(--p2);color:var(--tx)}.btn:hover{filter:brightness(.95)}
.btn.p{background:var(--pr);color:#fff}.btn.g{background:var(--ok);color:#fff}.btn.w{background:var(--md);color:#fff}.btn.r{background:var(--hi);color:#fff}.btn.s{padding:5px 10px;font-size:12px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--p2);color:var(--mu)}
.Approved{background:rgba(18,164,106,.15);color:var(--ok)}.Pending{background:rgba(91,75,255,.15);color:var(--pr)}.Changes{background:rgba(232,135,26,.17);color:var(--md)}.Rejected{background:rgba(229,54,91,.15);color:var(--hi)}
.high{--c:var(--hi)}.medium{--c:var(--md)}.low{--c:var(--lo)}
.f{border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--pn)}
.f h3{margin:0;font-size:15px}.f p{margin:6px 0 0;color:var(--mu)}.f p b{color:var(--tx)}.sg{background:var(--p2);border-radius:8px;padding:8px 10px;margin-top:8px;color:var(--tx)!important}
.bar{height:6px;border-radius:9px;background:var(--p2);overflow:hidden;width:90px;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--pg)}
mark{border-radius:4px;padding:0 3px;color:inherit;background:color-mix(in srgb,var(--c) 28%,transparent);border-bottom:2px solid var(--c)}
.doc{background:var(--p2);border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.8}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs .btn.on{background:var(--pr);color:#fff}
.hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.hb span:first-child{width:120px;color:var(--mu)}.hb div{flex:1;height:14px;background:var(--p2);border-radius:7px;overflow:hidden}.hb div i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pg));border-radius:7px}
.cols{display:grid;grid-template-columns:300px 1fr;gap:16px}.li{padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--pn)}.li.on{border-color:var(--pr);background:var(--p2)}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps span{flex:1;text-align:center;padding:6px;border-radius:8px;font-size:12px;font-weight:700;background:var(--p2);color:var(--mu)}.steps .d{background:var(--pr);color:#fff}
.hero{background:linear-gradient(120deg,var(--pr),var(--pg));color:#fff;border-radius:18px;padding:24px;margin-bottom:16px}.hero h1{color:#fff}.hero p{margin:4px 0 0;opacity:.92}
.scan{text-align:center;padding:34px}.scan i{display:block;width:44px;height:44px;margin:0 auto 12px;border:4px solid var(--p2);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--pn);color:var(--tx);max-width:520px;padding:24px}dialog::backdrop{background:rgba(5,8,20,.6)}
.note{font-size:12px;color:var(--mu)}
@media(max-width:860px){#app{flex-direction:column}#side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center;border-right:0;border-bottom:1px solid var(--bd)}.lbl{display:none}.nav{white-space:nowrap;width:auto}#main{padding:20px 16px 60px}.cols{grid-template-columns:1fr}.logo{margin:0}}
</style></head><body><div id="app"><aside id="side"></aside><main id="main"></main></div><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U={Manager:'Tarun',Employee:'Asha',Reviewer:'Ravi'};
const NAV={dash:['📊','Dashboard'],kb:['📚','Knowledge Base'],submit:['✍️','Submit & Review'],mine:['📁','My Submissions'],queue:['✅','Approval Queue'],insights:['📈','Insights'],audit:['🧾','Audit Log']};
const RN={Manager:['dash','kb','queue','insights','audit'],Employee:['dash','submit','mine'],Reviewer:['dash','queue','insights']};
const S={role:'Manager',page:'dash',kbTab:'Products',sel:1,draft:null,id:10,
products:[{id:1,name:'AquaPure X1 Water Purifier',price:12999,features:'7-stage RO+UV; 8 L tank; 1-year warranty'}],
claims:[{id:1,pid:1,text:'Removes up to 99% of dissolved impurities',proof:'Lab test LT-2025-14'},{id:2,pid:1,text:'1-year warranty on all parts',proof:'Warranty policy v3'}],
rules:[{id:1,kind:'banned',term:'cheap',rep:'affordable',note:'Brand voice guide p.4'},{id:2,kind:'banned',term:'best',rep:'',note:'Claims policy 2.1'},{id:3,kind:'banned',term:'miracle',rep:'',note:'Claims policy 2.1'},{id:4,kind:'preferred',term:'purifier machine',rep:'water purifier',note:'Terminology sheet'},{id:5,kind:'preferred',term:'buy',rep:'get',note:'Brand voice guide p.3'}],
subs:[],audit:[]};
const T0='BEST purifier machine in India!!! Buy now at just ₹9,999. 100% guaranteed pure water, a cheap miracle for your family!';
const lum=h=>{h=h.replace('#','');const f=c=>(c/=255)<=.03928?c/12.92:((c+.055)/1.055)**2.4;return .2126*f(parseInt(h.slice(0,2),16))+.7152*f(parseInt(h.slice(2,4),16))+.0722*f(parseInt(h.slice(4,6),16))};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function review(t,pid,o={}){const p=S.products.find(x=>x.id==pid)||S.products[0],L=t.toLowerCase(),F=[];
const add=(c,i,w,s,sv,cf,sg,r,orig)=>F.push({c,i,w,s,sv,cf,sg,r,o:orig||'Rule'});
S.rules.forEach(r=>{if(r.kind=='tone')return;const m=new RegExp('(?<!\\w)'+r.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?!\\w)','i').exec(t);if(!m)return;const rg=[m.index,m.index+m[0].length];
if(r.kind=='banned')add('Terminology','Banned word: “'+r.term+'”','This word is not allowed in brand communication.','Rule #'+r.id+' · '+r.note,'high',.98,r.rep?'Replace with “'+r.rep+'”.':'Remove it and describe the real benefit instead.',rg);
else add('Terminology','Non-preferred term: “'+r.term+'”','The terminology sheet prefers a different term.','Rule #'+r.id+' · '+r.note,'low',.9,'Use “'+r.rep+'”.',rg)});
const pr=/(?:₹|rs\.?|inr|\$)\s?([\d,]+(?:\.\d+)?)/gi;let m;while(m=pr.exec(t)){const v=parseFloat(m[1].replace(/,/g,''));if(Math.abs(v-p.price)>.5)add('Fact','Price mismatch: '+m[0],'The approved price is ₹'+p.price.toLocaleString('en-IN')+'.','Product #'+p.id+' · approved price','high',.97,'Use ₹'+p.price.toLocaleString('en-IN')+', or ask the manager to approve a new offer.',[m.index,m.index+m[0].length])}
const ap=S.claims.map(c=>c.text.toLowerCase()).join(' ');
['guaranteed','100%','cure','no.1','risk-free'].forEach(w=>{const i=L.indexOf(w);if(i>=0&&!ap.includes(w))add('Claim','Unsupported claim: “'+w+'”','No approved claim or proof supports this statement.','Approved claims list · no match found','high',.86,'Rephrase using an approved claim, or attach proof for review.',[i,i+w.length])});
const caps=[...t.matchAll(/\b[A-Z]{4,}\b/g)];if(caps.length>=2||(t.match(/!/g)||[]).length>=3)add('Tone','Shouting tone (ALL CAPS / many “!”)','Brand voice is calm, friendly and never pushy.','Tone rule · Brand voice guide p.2','medium',.8,'Use sentence case and at most one exclamation mark.',caps[0]?[caps[0].index,caps[0].index+caps[0][0].length]:null);
const ps=/buy now|hurry|limited time|last chance/i.exec(t);if(ps)add('Tone','Pushy urgency: “'+ps[0]+'”','Phrases that pressure buyers conflict with the “never pushy” voice.','Tone rule · Brand voice guide p.2','medium',.66,'Invite instead: “Get yours today.”',[ps.index,ps.index+ps[0].length],'AI');
const hl=/disease|cancer|illness/i.exec(t);if(hl)add('Claim','Possible health claim: “'+hl[0]+'”','Health benefits are not in the approved claims, so this cannot be verified.','No approved source','high',.52,'Remove it; describe only the approved filtration claim.',[hl.index,hl.index+hl[0].length],'AI');
if(o.img&&!(o.alt||'').trim())add('Accessibility','Image has no alt text','Screen-reader users cannot understand the image.','WCAG 1.1.1','medium',.99,'Add a short description of what the image shows.',null);
if(o.fg&&o.bg){const c=cr(o.fg,o.bg);if(c<4.5)add('Accessibility','Low colour contrast ('+c.toFixed(1)+':1)','Text needs at least 4.5:1 contrast against its background.','WCAG 1.4.3',c<3?'high':'medium',.99,'Use a darker text colour or a lighter background.',null)}
return F.sort((a,b)=>({high:0,medium:1,low:2}[a.sv]-{high:0,medium:1,low:2}[b.sv]))}
function hl(t,F){const R=F.filter(f=>f.r).map(f=>({a:f.r[0],b:f.r[1],sv:f.sv,i:f.i})).sort((x,y)=>x.a-y.a);let o='',p=0;R.forEach(r=>{if(r.a<p)return;o+=esc(t.slice(p,r.a))+`<mark class="${r.sv}" title="${esc(r.i)}">${esc(t.slice(r.a,r.b))}</mark>`;p=r.b});return o+esc(t.slice(p))}
const api=async(p,m='GET',b)=>{const r=await fetch('http://127.0.0.1:8000'+p,{method:m,headers:{'Content-Type':'application/json','X-Role':S.role,'X-User':U[S.role]},body:b?JSON.stringify(b):undefined});if(!r.ok){let e='Request failed';try{e=(await r.json()).detail||e}catch(_){}throw new Error(e)}return r.json()};
const load=async()=>{Object.assign(S,await api('/api/state'))};
const boot=async()=>{try{await load()}catch(e){toast('Backend not reachable: start the server first')}render()};
const stc=s=>({Pending:'Pending approval',Changes:'Changes requested'}[s]||s);
const chip=s=>`<span class="chip ${s}">${stc(s)}</span>`;
function fc(f,i,m,dec){return `<div class="f ${f.sv}"><div class="row"><h3>${esc(f.i)}</h3><span class="sp"></span><span class="chip">${f.c}</span><span class="chip">${f.o=='AI'?'🤖 AI (simulated)':'⚙️ Rule engine'}</span></div>
<p><b>Why flagged:</b> ${esc(f.w)}</p><p><b>Source:</b> ${esc(f.s)}</p><p class="sg">💡 <b>Suggested fix:</b> ${esc(f.sg)}</p>
<div class="row mt note">Confidence <span class="bar"><i style="width:${f.cf*100}%"></i></span> ${Math.round(f.cf*100)}% ${f.cf<.6?'<span class="chip Changes">⚠️ Needs human review</span>':''}<span class="sp"></span>
${m=='d'?`<button class="btn s ${dec=='fix'?'g':''}" onclick="dec(${i},'fix')">✔ I will fix it</button><button class="btn s ${dec=='dis'?'w':''}" onclick="dec(${i},'dis')">✋ I disagree</button><button class="btn s" onclick="navigator.clipboard&&navigator.clipboard.writeText(S.draft.F[${i}].sg);toast('Suggestion copied')">Copy</button>`:(dec?`<span class="chip">Creator: ${dec=='fix'?'will fix':'disagrees'}</span>`:'')}</div></div>`}
const sum=F=>['high','medium','low'].map(s=>`<span class="chip ${s}" style="color:var(--c)">${F.filter(f=>f.sv==s).length} ${s}</span>`).join(' ');
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2200)}
function side(){const pend=S.subs.filter(s=>s.status=='Pending').length;$('#side').innerHTML=`<div class="logo"><i>🛡️</i>BrandGuard</div><div class="lbl">Signed in as</div>
<select onchange="S.role=this.value;S.page='dash';render()">${Object.keys(U).map(r=>`<option ${r==S.role?'selected':''} value="${r}">${U[r]} · ${r}</option>`).join('')}</select><div class="lbl">Workspace</div>
${RN[S.role].map(p=>`<button class="nav ${S.page==p?'on':''}" onclick="S.page='${p}';render()">${NAV[p][0]} ${NAV[p][1]}${p=='queue'&&pend?`<b>${pend}</b>`:''}</button>`).join('')}
<div style="flex:1"></div><button class="nav" onclick="$('#dlg').innerHTML=privacy();$('#dlg').showModal()">🔒 AI &amp; privacy</button><button class="nav" onclick="theme()">🌓 Toggle theme</button>`}
function theme(){const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d=='dark'?'light':'dark'}
const privacy=()=>`<h2>🔒 AI use &amp; data protection</h2><p>• AI <b>only suggests</b>. Your text is never changed automatically; people make every final decision.</p><p>• Checks use <b>only the manager’s approved data</b>. If nothing supports a claim, we say “no approved source” instead of guessing.</p><p>• Findings below 60% confidence are routed to a human reviewer.</p><p>• Only the selected product’s approved data and the submitted text are sent to the AI service. Nothing is used to train models.</p><p>• Role-based access, version history and an audit log record every action.</p><p class="note">Prototype note: the AI layer is simulated here with rules; the backend will connect a real LLM.</p><form method="dialog"><button class="btn p">Got it</button></form>`;
function render(){side();window.scrollTo(0,0);$('#main').innerHTML=P[S.page]()}
const P={
dash(){const A=S.subs.flatMap(s=>s.v[s.v.length-1].F),n=s=>S.subs.filter(x=>x.status==s).length;const g={Manager:'Set the truth once; every submission is checked against it.',Employee:'Get clear, respectful feedback before you publish.',Reviewer:'Every claim arrives with its evidence attached.'}[S.role];
return `<div class="hero"><h1>Welcome back, ${U[S.role]} 👋</h1><p>${g}</p><div class="row mt"><button class="btn" onclick="S.page='${S.role=='Employee'?'submit':S.role=='Manager'?'kb':'queue'}';render()">${S.role=='Employee'?'Review new content':S.role=='Manager'?'Manage knowledge base':'Open approval queue'} →</button></div></div>
<div class="grid"><div class="card kpi"><b>${S.subs.length}</b><span>Total submissions</span></div><div class="card kpi"><b>${n('Pending')}</b><span>Awaiting approval</span></div><div class="card kpi"><b>${A.length}</b><span>Issues caught before publishing</span></div><div class="card kpi"><b>0</b><span>Auto-published / auto-edited by AI</span></div></div>
<h2 class="mt">How it works</h2><div class="grid">${[['1','Define','Manager adds facts, claims, rules'],['2','Submit','Creator uploads ad or notice'],['3','Review','AI flags issues with sources'],['4','Decide','Humans approve with comments']].map(s=>`<div class="card"><span class="chip Pending">Step ${s[0]}</span><h2 class="mt">${s[1]}</h2><span class="note">${s[2]}</span></div>`).join('')}</div>
<h2 class="mt">Recent activity</h2><div class="card">${S.audit.slice(0,5).map(a=>`<div class="row" style="padding:6px 0"><span class="note" style="width:110px">${a.ts}</span><b>${a.u}</b> ${esc(a.a)} <span class="note">· ${esc(a.d)}</span></div>`).join('')}</div>`},
kb(){const T=S.kbTab,pn=id=>(S.products.find(p=>p.id==id)||{}).name;let body='';
if(T=='Products')body=`<table><tr><th>Product</th><th>Approved price</th><th>Features</th><th></th></tr>${S.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>₹${p.price.toLocaleString('en-IN')}</td><td>${esc(p.features)}</td><td><button class="btn s r" onclick="del('products',${p.id})">Delete</button></td></tr>`).join('')}</table><div class="grid mt"><input id="a1" placeholder="Product name"><input id="a2" type="number" placeholder="Approved price (₹)"><input id="a3" placeholder="Key features"><button class="btn p" onclick="addKb('products')">+ Add product</button></div>`;
if(T=='Claims')body=`<table><tr><th>Approved claim</th><th>Product</th><th>Proof</th><th></th></tr>${S.claims.map(c=>`<tr><td>${esc(c.text)}</td><td>${esc(pn(c.pid)||'')}</td><td>📎 ${esc(c.proof)}</td><td><button class="btn s r" onclick="del('claims',${c.id})">Delete</button></td></tr>`).join('')}</table><div class="grid mt"><select id="a1">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input id="a2" placeholder="Approved claim"><input id="a3" placeholder="Proof / document"><button class="btn p" onclick="addKb('claims')">+ Add claim</button></div>`;
if(T=='Rules')body=`<table><tr><th>Type</th><th>Term</th><th>Use instead</th><th>Source</th><th></th></tr>${S.rules.map(r=>`<tr><td>${chip(r.kind=='banned'?'Rejected':'Pending').replace(/>[^<]+</,'>'+r.kind+'<')}</td><td><b>${esc(r.term)}</b></td><td>${esc(r.rep||'—')}</td><td>${esc(r.note)}</td><td><button class="btn s r" onclick="del('rules',${r.id})">Delete</button></td></tr>`).join('')}</table><div class="grid mt"><select id="a1"><option>banned</option><option>preferred</option></select><input id="a2" placeholder="Term"><input id="a3" placeholder="Replacement (optional)"><input id="a4" placeholder="Source note"><button class="btn p" onclick="addKb('rules')">+ Add rule</button></div>`;
return `<h1>Knowledge base</h1><p class="sub">The single source of truth. The AI checks content only against what is stored here.</p><div class="tabs">${['Products','Claims','Rules'].map(t=>`<button class="btn ${T==t?'on':''}" onclick="S.kbTab='${t}';render()">${t}</button>`).join('')}</div><div class="card">${body}</div>`},
submit(){const d=S.draft||(S.draft={pid:1,title:'',text:'',fg:'#999999',bg:'#ffffff',img:false,alt:'',F:null,dec:{}});
return `<h1>Submit &amp; review</h1><p class="sub">${d.rev?'Revising “'+esc(d.title)+'” (new version)':'Check your content before it goes to approval.'} Suggestions only; your text is never changed.</p>
<div class="card"><div class="grid"><div><label class="note">Product</label><select onchange="S.draft.pid=this.value">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label class="note">Title</label><input value="${esc(d.title)}" oninput="S.draft.title=this.value" placeholder="e.g. Diwali social post"></div></div>
<label class="note">Content (ad, notice or template)</label><textarea oninput="S.draft.text=this.value" placeholder="Paste your copy here…">${esc(d.text)}</textarea>
<div class="row mt"><span class="note">Text colour</span><input type="color" value="${d.fg}" oninput="S.draft.fg=this.value"><span class="note">Background</span><input type="color" value="${d.bg}" oninput="S.draft.bg=this.value"><label class="row"><input type="checkbox" ${d.img?'checked':''} onchange="S.draft.img=this.checked;$('#alt').style.display=this.checked?'block':'none'"> Contains image</label><input id="alt" style="display:${d.img?'block':'none'};max-width:240px" placeholder="Image alt text" value="${esc(d.alt)}" oninput="S.draft.alt=this.value"></div>
<div class="row mt"><button class="btn p" onclick="run()">🔍 Run AI review</button><button class="btn" onclick="S.draft.text=T0;S.draft.title=S.draft.title||'Diwali offer post';render()">Load sample ad with errors</button></div></div><div id="res" class="mt"></div>`},
mine(){const L=S.subs.filter(s=>s.author=='Asha');return `<h1>My submissions</h1><p class="sub">Track status, comments and versions.</p>${L.map(s=>{const l=s.v[s.v.length-1],k={Pending:1,Changes:2,Approved:2,Rejected:2}[s.status];return `<div class="card mt"><div class="row"><h2 style="margin:0">${esc(s.title)}</h2>${chip(s.status)}<span class="sp"></span><span class="note">${s.v.length} version(s)</span>${s.status=='Changes'?`<button class="btn w" onclick="revise(${s.id})">✏️ Revise</button>`:''}</div>
<div class="steps"><span class="d">Submitted</span><span class="${k>=1?'d':''}">Under review</span><span class="${k>=2?'d':''}">Decision</span></div><div class="doc">${hl(l.text,l.F)}</div>${s.comments.map(c=>`<p>💬 <b>${c.u}:</b> ${esc(c.t)}</p>`).join('')}</div>`}).join('')}`},
queue(){const s=S.subs.find(x=>x.id==S.sel)||S.subs[0],l=s.v[s.v.length-1];
return `<h1>Approval queue</h1><p class="sub">Review findings, discuss and decide. Nothing is published without a human decision.</p><div class="cols"><div>${S.subs.map(x=>`<div class="li ${x.id==s.id?'on':''}" onclick="S.sel=${x.id};render()"><b>${esc(x.title)}</b><div class="row note">${x.author} · v${x.v.length} ${chip(x.status)}</div></div>`).join('')}</div>
<div class="card"><div class="row"><h2 style="margin:0">${esc(s.title)}</h2>${chip(s.status)}<span class="sp"></span>${sum(l.F)}</div><div class="doc mt">${hl(l.text,l.F)}</div>
<h2 class="mt">Findings (${l.F.length})</h2>${l.F.length?l.F.map((f,i)=>fc(f,i,'r',l.dec[i])).join(''):'<p>✅ No issues found against approved sources.</p>'}
<h2 class="mt">Discussion &amp; history</h2>${s.comments.map(c=>`<p>💬 <b>${c.u}:</b> ${esc(c.t)}</p>`).join('')||'<p class="note">No comments yet.</p>'}
<div class="row mt"><input id="cm" placeholder="Add a comment for the creator…" style="flex:1"></div><div class="row mt"><button class="btn g" onclick="decide('Approved')">✅ Approve</button><button class="btn w" onclick="decide('Changes')">✏️ Request changes</button><button class="btn r" onclick="decide('Rejected')">⛔ Reject</button></div></div></div>`},
insights(){const A=S.subs.flatMap(s=>s.v.flatMap(v=>v.F)),cnt=(k)=>{const m={};A.forEach(f=>m[f[k]]=(m[f[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bars=(L)=>{const mx=Math.max(1,...L.map(x=>x[1]));return L.map(x=>`<div class="hb"><span>${esc(x[0].slice(0,22))}</span><div><i style="width:${x[1]/mx*100}%"></i></div><b>${x[1]}</b></div>`).join('')},src=cnt('s').slice(0,5),tr=[18,15,14,9,7,5],mx=18;
return `<h1>Governance insights</h1><p class="sub">Spot repeated mistakes and unclear guidelines over time.</p><div class="grid"><div class="card kpi"><b>${A.length}</b><span>Findings logged</span></div><div class="card kpi"><b>4.2 h</b><span>Avg. time to approval (sample)</span></div><div class="card kpi"><b>38%</b><span>First-pass clean rate (sample)</span></div></div>
<div class="grid mt" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Mistakes by category</h2>${bars(cnt('c'))}</div><div class="card"><h2>Most-triggered sources</h2>${bars(src)}</div></div>
<div class="grid mt" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Weekly issues per submission (trend)</h2><div class="row" style="align-items:flex-end;height:120px">${tr.map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v/mx*90}px;background:linear-gradient(var(--pr),var(--pg));border-radius:6px 6px 0 0"></div><span class="note">W${i+1}</span></div>`).join('')}</div><p class="note">Sample trend: errors fall as creators learn the rules.</p></div>
<div class="card"><h2>💡 Guideline-gap alerts</h2>${src.filter(x=>x[1]>=2).map(x=>`<div class="f medium"><b>${esc(x[0])}</b><p>Triggered ${x[1]} times. Consider adding an example or clearer wording to the brand guide.</p></div>`).join('')||'<p class="note">No repeated patterns yet.</p>'}</div></div>`},
audit(){return `<h1>Audit log</h1><p class="sub">Every action is recorded for accountability.</p><div class="card"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr>${S.audit.map(a=>`<tr><td>${a.ts}</td><td>${a.u}</td><td>${esc(a.a)}</td><td>${esc(a.d)}</td></tr>`).join('')}</table></div>`}};
async function run(){const d=S.draft;if(!d.text.trim())return toast('Please enter some content first');$('#res').innerHTML='<div class="card scan"><i></i><b>Checking against approved sources…</b><p class="note">Facts · claims · tone · terminology · accessibility</p></div>';
try{d.F=await api('/api/review','POST',{text:d.text,pid:+d.pid,fg:d.fg,bg:d.bg,img:d.img,alt:d.alt})}catch(e){d.F=review(d.text,d.pid,d);toast('Offline: used local rules')}d.dec={};res()}
function res(){const d=S.draft,F=d.F;$('#res').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Review result</h2><span class="sp"></span>${sum(F)}</div><p class="note">🤖 AI-assisted suggestions. You stay in control: your text below is unchanged.</p><div class="doc">${hl(d.text,F)}</div></div><h2 class="mt">Findings (${F.length})</h2>${F.length?F.map((f,i)=>fc(f,i,'d',d.dec[i])).join(''):'<div class="card">✅ No issues found against approved sources.</div>'}<div class="row mt"><button class="btn p" onclick="send()">📨 Send for approval</button><span class="note">Edit the text above and re-run the review any time.</span></div>`}
function dec(i,v){S.draft.dec[i]=v;res()}
async function send(){const d=S.draft;if(!d.F)return toast('Run the review first');try{await api('/api/submissions','POST',{title:d.title||'Untitled',pid:+d.pid,text:d.text,fg:d.fg,bg:d.bg,img:d.img,alt:d.alt,dec:d.dec,rev:d.rev||null});await load();S.draft=null;S.page='mine';render();toast('Sent to manager for approval')}catch(e){toast(e.message)}}
function revise(id){const s=S.subs.find(x=>x.id==id),l=s.v[s.v.length-1];S.draft={pid:s.pid,title:s.title,text:l.text,fg:'#222222',bg:'#ffffff',img:false,alt:'',F:null,dec:{},rev:id};S.role='Employee';S.page='submit';render()}
async function decide(st){const s=S.subs.find(x=>x.id==S.sel)||S.subs[0];try{await api('/api/submissions/'+s.id+'/decision','POST',{status:st,comment:$('#cm').value.trim()});await load();render();toast(stc(st)+': '+s.title)}catch(e){toast(e.message)}}
async function addKb(k){const v=i=>($('#a'+i)||{}).value||'';if(k=='products'?!v(1):!v(2))return toast('Please fill in the required fields');const b={products:{name:v(1),price:+v(2)||0,features:v(3)},claims:{pid:+v(1),text:v(2),proof:v(3)},rules:{kind:v(1),term:v(2),rep:v(3),note:v(4)}}[k];try{await api('/api/'+k,'POST',b);await load();render();toast('Saved')}catch(e){toast(e.message)}}
async function del(k,id){try{await api('/api/'+k+'/'+id,'DELETE');await load();render()}catch(e){toast(e.message)}}
boot();
</script></body></html>
